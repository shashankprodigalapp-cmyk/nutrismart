<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111113" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nutri Smart" />
    <meta name="description" content="India's first nutrition app with Kitchen Intelligence. Track Indian food, calories, GL, protein." />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>Nutri Smart: A Sensible Pilot — Indian Nutrition Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script id="ns-selfheal">
      // If the app is still blank after 6s (stale offline copy after an update),
      // clear the offline cache and reload once.
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.children.length) return;
        try { if (sessionStorage.getItem('ns_healed')) return; sessionStorage.setItem('ns_healed', '1'); } catch (e) {}
        var jobs = [];
        if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
        if (window.caches) jobs.push(caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }));
        Promise.all(jobs).then(function () { location.reload(); }, function () { location.reload(); });
      }, 6000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

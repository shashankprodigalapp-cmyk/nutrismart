name: Browser e2e (Layer C)

on:
  schedule:
    - cron: '30 6 * * *'   # 06:30 UTC, after the integration-tests job
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright specs
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://nutrismart-3bb.pages.dev' }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          ADMIN_TEST_USER_EMAIL: ${{ secrets.ADMIN_TEST_USER_EMAIL }}
          ADMIN_TEST_USER_PASSWORD: ${{ secrets.ADMIN_TEST_USER_PASSWORD }}
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
